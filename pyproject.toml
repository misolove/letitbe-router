[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "letitbe-router"
version = "0.1.0"
description = "Local-first semantic routing plus adaptive limit-aware scheduling for AI agents and model CLIs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "misolove" }]
dependencies = [
  "semantic-router>=0.1.12,<0.2",
  "numpy>=1.26",
]

[project.scripts]
lr = "letitbe_router.cli:main"
lrouter = "letitbe_router.cli:main"
letitbe-router = "letitbe_router.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/letitbe_router"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
